[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "repo-miner"
version = "0.1.0"
description = "CLI para mineracao de repositorios Git e identificacao de hot spots de manutencao."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Marcelo Augusto Mrad Marteleto" },
  { name = "Tomas Lacerda Muniz" },
  { name = "Lorenzo Carneiro Magalhaes" },
]
dependencies = [
  "lizard>=1.17.10",
  "plotext>=5.3.2",
  "pydriller>=2.7",
  "rich>=13.7.1",
  "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
repo-miner = "repo_miner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_miner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
